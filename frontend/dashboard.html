<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Food Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>Food Tracker</h2>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </nav>

    <div class="container dashboard-container">
        <div class="card upload-section">
            <h3>Analyze Food</h3>
            <input type="file" id="imageInput" accept="image/*">
            <br>
            <label>Weight (grams): <input type="number" id="weight" value="100"></label>
            <button onclick="analyzeFood()" class="primary-btn">Analyze</button>
            <p id="status"></p>
        </div>

        <div class="card result-section" id="resultBox" style="display: none;">
            <h3>Results</h3>
            <p><strong>Food:</strong> <span id="foodName"></span></p>
            <p><strong>Confidence:</strong> <span id="confidence"></span></p>
            <p><strong>Nutrition:</strong></p>
            <ul id="nutritionList"></ul>
            <p><strong>Summary:</strong> <span id="summary"></span></p>
        </div>

        <div class="card history-section">
            <h3>Recent Logs</h3>
            <ul id="historyList">Loading history...</ul>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
