<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NutriSnap</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hero-bg" id="particles-js">
        <div class="container">
            
            <header class="dashboard-header">
                <div>
                    <h1 class="title">NutriSnap</h1>
                    <p class="subtitle">Cosmic Food Tracker</p>
                </div>
                <button id="logout-btn" class="btn-exit">Log Out</button>
            </header>

            <main>
                <div class="filter-bar">
                    <input type="text" id="search-logs" placeholder="🔍 Search logs..." class="input-field" />
                    <select id="filter-weight" class="input-field">
                        <option value="all">All Weights</option>
                        <option value="50">50g</option>
                        <option value="100">100g</option>
                        <option value="150">150g</option>
                    </select>
                </div>

                <div class="dashboard-grid">
                    
                    <section class="module capture-module">
                        <h2 class="module-title">📸 Scan Food</h2>
                        
                        <label class="file-upload-label">
                            <span>Click to Upload Image</span>
                            <input type="file" id="image-input" accept="image/*">
                        </label>

                        <div class="control-row">
                            <label>Weight:</label>
                            <select id="weight" class="input-field">
                                <option value="50">50g</option>
                                <option value="100" selected>100g</option>
                                <option value="150">150g</option>
                            </select>
                        </div>
                        
                        <button id="analyze-btn" class="btn-galactic">Analyze Now</button>
                        
                        <div id="preview" class="preview-area"></div>
                        <div id="result" class="result-card" style="display:none;"></div> </section>

                    <section class="module logs-module">
                        <h2 class="module-title">📜 History</h2>
                        <div class="logs-pod">
                            <ul id="food-logs" class="cosmic-logs">
                                </ul>
                        </div>
                    </section>

                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
